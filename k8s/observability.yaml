apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerdb-prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 2s
    scrape_configs:
      - job_name: ledgerdb-raft
        metrics_path: /metrics
        static_configs:
          - targets:
              - ledgerdb-0.ledgerdb:8000
              - ledgerdb-1.ledgerdb:8000
              - ledgerdb-2.ledgerdb:8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerdb-prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerdb-prometheus
  template:
    metadata:
      labels:
        app: ledgerdb-prometheus
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.54.1
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
      volumes:
        - name: config
          configMap:
            name: ledgerdb-prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerdb-prometheus
spec:
  selector:
    app: ledgerdb-prometheus
  ports:
    - port: 9090
      targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerdb-grafana-provisioning
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://ledgerdb-prometheus:9090
        isDefault: true
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: LedgerDB
        folder: LedgerDB
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ledgerdb-chaos-dashboard
data:
  day9-chaos.json: |
    {
      "title": "LedgerDB v1.0 \u2014 Operations",
      "uid": "ledgerdb-v1",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "5s",
      "panels": [
        {
          "id": 1,
          "title": "Leader election rate",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(ledgerdb_raft_leader_elections_total[1m]))",
              "legendFormat": "elections/sec"
            }
          ]
        },
        {
          "id": 2,
          "title": "Current leader",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "ledgerdb_raft_is_leader",
              "legendFormat": "{{node_id}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "Replication lag",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "ledgerdb_raft_replication_lag",
              "legendFormat": "{{node_id}} \u2192 {{peer_id}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "Query latency (avg, 1m)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(ledgerdb_query_latency_seconds_sum[1m])) / clamp_min(sum(rate(ledgerdb_query_requests_total[1m])), 1e-9)",
              "legendFormat": "average latency"
            }
          ]
        },
        {
          "id": 5,
          "title": "Query throughput",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(ledgerdb_query_requests_total[1m]))",
              "legendFormat": "queries/sec"
            }
          ]
        },
        {
          "id": 6,
          "title": "Node readiness",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "ledgerdb_raft_ready",
              "legendFormat": "{{node_id}}"
            }
          ]
        },
        {
          "id": 7,
          "title": "Committed transactions/sec",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "sum(rate(ledgerdb_transactions_committed_total[1m]))",
              "legendFormat": "transactions/sec"
            }
          ]
        },
        {
          "id": 8,
          "title": "Raft term",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 24,
            "w": 12,
            "h": 8
          },
          "targets": [
            {
              "expr": "ledgerdb_raft_term",
              "legendFormat": "{{node_id}}"
            }
          ]
        }
      ]
    }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledgerdb-grafana
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ledgerdb-grafana
  template:
    metadata:
      labels:
        app: ledgerdb-grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.1.0
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              value: admin
          ports:
            - containerPort: 3000
          volumeMounts:
            - name: provisioning
              mountPath: /etc/grafana/provisioning/datasources/datasource.yml
              subPath: datasource.yml
            - name: provisioning
              mountPath: /etc/grafana/provisioning/dashboards/dashboard.yml
              subPath: dashboards.yml
            - name: dashboard
              mountPath: /var/lib/grafana/dashboards
      volumes:
        - name: provisioning
          configMap:
            name: ledgerdb-grafana-provisioning
        - name: dashboard
          configMap:
            name: ledgerdb-chaos-dashboard
---
apiVersion: v1
kind: Service
metadata:
  name: ledgerdb-grafana
spec:
  selector:
    app: ledgerdb-grafana
  ports:
    - port: 3000
      targetPort: 3000
