apiVersion: v1
kind: Service
metadata:
  name: ledgerdb
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: ledgerdb
  ports:
    - name: raft
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ledgerdb
spec:
  serviceName: ledgerdb
  replicas: 3
  selector:
    matchLabels:
      app: ledgerdb
  template:
    metadata:
      labels:
        app: ledgerdb
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: ledgerdb
          image: ghcr.io/REPLACE_OWNER/ledgerdb:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "ledgerdb.cli"]
          args:
            - "--data-dir"
            - "/var/lib/ledgerdb"
            - "raft-server"
            - "--peers"
            - "ledgerdb-0=ledgerdb-0.ledgerdb:8000,ledgerdb-1=ledgerdb-1.ledgerdb:8000,ledgerdb-2=ledgerdb-2.ledgerdb:8000"
            - "--port"
            - "8000"
          env:
            - name: HOSTNAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: raft
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /status
              port: raft
            initialDelaySeconds: 2
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/ledgerdb
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
